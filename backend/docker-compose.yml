services:
  esg-extractor:
    build: .
    container_name: esg-extractor
    ports:
      - "8082:8082"
    volumes:
      # 共享输出目录（供 ADP 评分容器读取）
      - ./output:/app/output
    environment:
      # DeepSeek API 配置
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - DEEPSEEK_THINKING=${DEEPSEEK_THINKING:-disabled}
      - DEEPSEEK_REASONING_EFFORT=${DEEPSEEK_REASONING_EFFORT:-low}
      # 端口配置
      - PORT=8082
      # 提示词路径（容器内固定）
      - EXTRACTION_PROMPT_FILE=/app/extraction_prompt.md
    env_file:
      - .env
    networks:
      - ai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r = requests.get('http://localhost:8082/api/health', timeout=5); exit(0 if r.status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: esg-frontend
    ports:
      # 80 对宿主机（Cloudflare Tunnel 从这个端口暴露到公网）
      - "80:80"
    depends_on:
      - esg-extractor
    networks:
      - ai-network
    restart: unless-stopped

networks:
  ai-network:
    external: true
