services:
  esg-extractor:
    build: .
    container_name: esg-extractor
    ports:
      # v=83：只绑 localhost，防局域网直连消耗 token（nginx 容器内走 esg-extractor:8082 不受影响）
      - "127.0.0.1:8082:8082"
    volumes:
      # 共享输出目录（供 ADP 评分容器读取）
      - ./output:/app/output
    environment:
      # DeepSeek API 配置
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - DEEPSEEK_THINKING=${DEEPSEEK_THINKING:-disabled}
      - DEEPSEEK_REASONING_EFFORT=${DEEPSEEK_REASONING_EFFORT:-low}
      # 端口配置
      - PORT=8082
      # 提示词路径（容器内固定）
      - EXTRACTION_PROMPT_FILE=/app/extraction_prompt.md
    env_file:
      - .env
    networks:
      - ai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r = requests.get('http://localhost:8082/api/health', timeout=5); exit(0 if r.status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: esg-frontend
    ports:
      # 80 对宿主机（Cloudflare Tunnel 从这个端口暴露到公网）
      - "80:80"
    depends_on:
      - esg-extractor
      - esg-agent2
    networks:
      - ai-network
    restart: unless-stopped

  # 智能体二 · 障碍度根因分析（双后端：deepseek 默认自主可控 | adp 比赛展示）
  esg-agent2:
    build: ./agent2
    container_name: esg-agent2
    ports:
      # v=83：只绑 localhost（nginx 容器内走 esg-agent2:8083 不受影响）
      - "127.0.0.1:8083:8083"
    environment:
      # 后端切换：deepseek（自主可控）| adp（比赛展示）
      - ADP_BACKEND=${ADP_BACKEND:-deepseek}
      # DeepSeek（deepseek 模式，复用同一 key）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - DEEPSEEK_THINKING=${DEEPSEEK_THINKING:-disabled}
      - DEEPSEEK_REASONING_EFFORT=${DEEPSEEK_REASONING_EFFORT:-low}
      # 端口
      - PORT=8083
    env_file:
      - .env
    networks:
      - ai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r = requests.get('http://localhost:8083/api/health', timeout=5); exit(0 if r.status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # LLM API 网关（one-api，v=78 新增）
  # 统一管理 DeepSeek/GLM/Kimi/MiniMax 等多平台渠道，前端下拉切模型由网关路由
  esg-one-api:
    image: ghcr.io/songquanpeng/one-api:latest
    container_name: esg-one-api
    ports:
      # 宿主机 3001 → 容器 3000（管理 UI；容器内 esg-extractor/agent2 用 http://esg-one-api:3000）
      # v=83：只绑 localhost，管理 UI 不对外
      - "127.0.0.1:3001:3000"
    volumes:
      - esg-one-api-data:/data   # SQLite 持久化（渠道配置/用户/token）
    environment:
      - TZ=Asia/Shanghai
    networks:
      - ai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' | awk -F: '{print $2}'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  ai-network:
    external: true

volumes:
  esg-one-api-data:
