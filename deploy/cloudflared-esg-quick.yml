# ESG 碳治理能力画像系统 · 临时 Quick Tunnel
#
# 用途：需要临时对外测试入口，但又不能碰自有域名时使用。
#       Quick tunnel 走 *.trycloudflare.com 随机主机名，**无需账号、无需 Token、
#       完全不触碰自有域名** —— 域名处于 ICP 备案审核期时的合规选择。
#
# 启动：docker-compose -f cloudflared-esg-quick.yml up -d
#       （推荐用 stack_ctl.ps1 -Action StartQuick，会自动抓取并打印公网地址）
# 取地址：docker logs cloudflared-esg-quick 2>&1 | grep -o 'https://[a-z0-9-]*\.trycloudflare\.com'
# 停止：docker stop cloudflared-esg-quick
#
# 与 cloudflared-esg-tunnel.yml 的区别：
#   那个 = 命名隧道（固定主机名，需 Token，长期使用）
#   本文件 = 快速隧道（随机地址，无需 Token，一次性使用）
#   两者互不影响，可分别启停。

services:
  cloudflared-esg-quick:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-esg-quick
    # 故意用 "no" 而不是 unless-stopped：
    #   quick tunnel 的随机地址是「进程启动时」分配的。容器若被自动重启，
    #   地址会变而没人知道新地址 → 使用方手上的链接静默失效。宁可让它停着，
    #   由人工重启并重新分发地址。（进程内部对边缘断线会自动重连，地址不变）
    restart: "no"
    command: tunnel --no-autoupdate --edge-ip-version 4 --protocol http2 --metrics 0.0.0.0:20242 --url http://esg-frontend:80
    dns:
      - 223.5.5.5       # 阿里 DNS
      - 180.76.76.76    # 百度 DNS（备份）
    ports:
      # 仅绑宿主机回环，供人工查 /ready；不要改成 0.0.0.0
      - "127.0.0.1:20242:20242"
    networks:
      - ai-network

networks:
  ai-network:
    external: true
