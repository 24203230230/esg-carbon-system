server {
    listen 80;
    server_name _;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # 提取服务反向代理（转发到 esg-extractor 容器）
    # 覆盖 /api/extract、/api/health、/api/extract_score 等全部提取相关接口
    location /api/ {
        proxy_pass http://esg-extractor:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # 提取耗时可能较长
        proxy_connect_timeout 30s;
        client_max_body_size 200M;  # 允许大文件上传（ESG报告PDF，200MB上限）
    }

    # 智能体二·根因分析（转发到 esg-agent2 容器，双后端 deepseek/adp）
    # nginx 最长前缀优先：/api/suggest 精确匹配此 location
    location /api/suggest {
        proxy_pass http://esg-agent2:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # 根因分析耗时可能较长
        proxy_connect_timeout 30s;
        client_max_body_size 20M;
    }

    # v=85：WeasyPrint 精美 PDF 报告（转发到 esg-extractor）
    # 精确前缀：/api/report 优先于 /api/ 通用 location
    location /api/report {
        proxy_pass http://esg-extractor:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # WeasyPrint 渲染可能较慢
        proxy_connect_timeout 30s;
        client_max_body_size 20M;  # JSON 请求体（含雷达图 base64）
    }

    # SPA 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（部署后启用缓存，调试期禁用）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        # expires 7d;
        # add_header Cache-Control "public";
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
}
