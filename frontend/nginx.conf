server {
    listen 80;
    server_name _;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # ===== v=92：开启 gzip 压缩（减少穿隧道的传输字节）=====
    # 隧道吞吐实测仅 ~115KB/s，压缩后文本资源体积可降 60-75%
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;          # 小于 1KB 不压缩（压缩收益低于包头开销）
    gzip_vary on;                  # 输出 Vary: Accept-Encoding，便于 Cloudflare/CDN 正确缓存
    gzip_proxied any;
    gzip_types text/plain text/css text/xml
               application/javascript application/json application/xml
               image/svg+xml;

    # 提取服务反向代理（转发到 esg-extractor 容器）
    # 覆盖 /api/extract、/api/health、/api/extract_score 等全部提取相关接口
    location /api/ {
        proxy_pass http://esg-extractor:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # v=93：扫描件 OCR 兜底约需 6 分钟（49页 × 7.4s），必须 ≥ 前端 600s 超时，
        #       否则 nginx 会先返回 504（原来只有 300s，OCR 场景必挂）
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_body_timeout 300s;  # 大文件（近100MB）经隧道上传慢，放宽读体超时
        proxy_connect_timeout 30s;
        client_max_body_size 200M;  # 允许大文件上传（ESG报告PDF，200MB上限）
    }

    # 智能体二·根因分析（转发到 esg-agent2 容器，双后端 deepseek/adp）
    # nginx 最长前缀优先：/api/suggest 精确匹配此 location
    location /api/suggest {
        proxy_pass http://esg-agent2:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # 根因分析耗时可能较长
        proxy_connect_timeout 30s;
        client_max_body_size 20M;
    }

    # v=85：WeasyPrint 精美 PDF 报告（转发到 esg-extractor）
    # 精确前缀：/api/report 优先于 /api/ 通用 location
    location /api/report {
        proxy_pass http://esg-extractor:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # WeasyPrint 渲染可能较慢
        proxy_connect_timeout 30s;
        client_max_body_size 20M;  # JSON 请求体（含雷达图 base64）
    }

    # SPA 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== v=92：静态资源生产缓存策略（原调试期 no-store 已移除）=====
    # 背景：原配置 add_header Cache-Control "no-cache, no-store" 导致
    #       ① 浏览器每次访问全量重下 ② Cloudflare 看到 no-store 直接 BYPASS 不缓存
    #       ③ 每个请求都要跨国穿隧道（边缘节点在美国）→ 首屏 4-5 分钟
    # 现改为长缓存：前端所有 js/css 均带 ?v=NN 版本号，改版本号即自动失效，安全。
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 入口 HTML 保持协商缓存（每次校验，发布新版立即生效）
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
}
